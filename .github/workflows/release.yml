name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # npm OIDC trusted publishing

# Per tag, not global: GitHub keeps one pending run per group, so a shared
# group would cancel a waiting release outright. Different tags can therefore
# run together and race on the tap branch; the tap step handles that by
# re-fetching and re-applying on a rejected push, and never moves the formula
# to an older version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# One sequential pipeline (spotmoji-style): validate -> test -> build ->
# GitHub Release -> Homebrew tap -> npm. Re-runs are idempotent: release
# uploads use --clobber, the tap bump no-ops when already current, and npm
# skips a version that is already published.
#
# Secrets: HOMEBREW_TAP_TOKEN (fine-grained PAT for omarshahine/homebrew-tap,
# Contents: read & write). npm publishes via OIDC trusted publishing once the
# package exists and this repo/workflow is configured as its trusted publisher
# on npmjs.com; until then the npm step warns and skips.
jobs:
  release:
    name: Test, build, and publish
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out journal-cli
        uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must look like v1.2.3" >&2
            exit 1
          fi
          PKG_VERSION=$(node -p "require('./npm/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $VERSION does not match npm/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ARCHIVE=journal-cli-${GITHUB_REF_NAME}-macos-universal.tar.gz" >> "$GITHUB_ENV"

      - name: Build universal binary
        # Per-triple builds + lipo instead of `--arch a --arch b`: the multi-arch
        # flag routes through Xcode's swbuild daemon, which can wedge; the
        # per-triple path uses SwiftPM's own build engine.
        run: |
          set -euo pipefail
          swift build -c release --triple arm64-apple-macosx
          swift build -c release --triple x86_64-apple-macosx
          mkdir -p .build/apple/Products/Release
          lipo -create \
            .build/arm64-apple-macosx/release/journal-cli \
            .build/x86_64-apple-macosx/release/journal-cli \
            -output .build/apple/Products/Release/journal-cli
          file .build/apple/Products/Release/journal-cli
        working-directory: swift

      - name: Test the release binary
        env:
          JOURNAL_CLI: ${{ github.workspace }}/swift/.build/apple/Products/Release/journal-cli
        run: |
          set -euo pipefail
          DB=$(tests/make-fixture.sh "$RUNNER_TEMP/fixture")
          JOURNAL_SEED="$DB" tests/test_write.sh

      - name: Package binary
        run: |
          set -euo pipefail
          BIN=swift/.build/apple/Products/Release/journal-cli
          file "$BIN"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" journal-cli
          shasum -a 256 "$ARCHIVE" | tee checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" checksums.txt \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" checksums.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "journal-cli $GITHUB_REF_NAME"
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: omarshahine/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download source archive
        run: |
          set -euo pipefail
          TARBALL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          # Retry to absorb the brief delay before GitHub serves a fresh tag
          # tarball. Download to a temp path and promote it only on success, so
          # a partial transfer can never be hashed into the formula.
          rm -f source.tar.gz source.tar.gz.part
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$TARBALL" -o source.tar.gz.part; then
              mv source.tar.gz.part source.tar.gz
              break
            fi
            rm -f source.tar.gz.part
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          if [ ! -s source.tar.gz ]; then
            echo "::error::Could not download $TARBALL after 5 attempts; not touching the formula."
            exit 1
          fi
          tar tzf source.tar.gz >/dev/null
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 source.tar.gz | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Update and push Homebrew formula
        run: |
          set -euo pipefail
          TAP=homebrew-tap
          FILE=Formula/journal-cli.rb
          BRANCH=$(git -C "$TAP" rev-parse --abbrev-ref HEAD)
          git -C "$TAP" config user.name  "github-actions[bot]"
          git -C "$TAP" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another tag's release can push to the tap between our checkout and
          # our push. On a rejected push, start over from the tap's new tip:
          # re-check the version there, re-apply, and push again.
          for attempt in 1 2 3 4 5; do
            # Never move the formula backwards: an older tag re-run (or one
            # that finishes after a newer release) must not replace it.
            CURRENT=$(sed -nE 's|.*/archive/refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)\.tar\.gz".*|\1|p' "$TAP/$FILE" | head -1)
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$VERSION" ] &&
               [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" = "$CURRENT" ]; then
              echo "::warning::Tap formula is at $CURRENT, newer than $VERSION; leaving it alone."
              exit 0
            fi

            perl -0pi -e "s{url \"https://github.com/${GITHUB_REPOSITORY//\//\\/}/archive/refs/tags/v[^\"]+\.tar\.gz\"}{url \"$TARBALL\"}" "$TAP/$FILE"
            perl -0pi -e "s{^(\s*)sha256 \"[0-9a-f]{64}\"}{\${1}sha256 \"$SHA256\"}m" "$TAP/$FILE"
            brew style "$TAP/$FILE"
            grep -nE 'url |sha256 ' "$TAP/$FILE" | head -4

            git -C "$TAP" add "$FILE"
            if git -C "$TAP" diff --cached --quiet; then
              echo "Formula already up to date."
              exit 0
            fi
            git -C "$TAP" commit -q -m "journal-cli: update to v${VERSION}"
            if git -C "$TAP" push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Tap push rejected (attempt $attempt); re-fetching and re-applying..."
            git -C "$TAP" fetch -q origin "$BRANCH"
            git -C "$TAP" reset -q --hard FETCH_HEAD
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the formula after 5 attempts."
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Steady state: OIDC trusted publishing (no token). First-time
          # bootstrap: OIDC cannot create a package, so if the package does not
          # exist yet, fall back to the NPM_TOKEN secret when present; once the
          # package exists and this repo is configured as its trusted publisher
          # on npmjs.com, the token secret can be deleted.
          cd npm
          # npm versions are immutable, so a re-run after a successful publish
          # must skip rather than fail. Only a 404 means "not there"; any other
          # registry error fails the step instead of being read as absence.
          lookup() { # prints "yes" or "no"; exits on a registry error
            local out
            if out=$(npm view "$1" version 2>npm-view.err); then
              [ -n "$out" ] && echo yes || echo no
            elif grep -q E404 npm-view.err; then
              echo no
            else
              cat npm-view.err >&2
              echo "::error::npm registry lookup for $1 failed" >&2
              return 1
            fi
          }
          VERSION_PUBLISHED=$(lookup "apple-journal-cli@$VERSION")
          if [ "$VERSION_PUBLISHED" = yes ]; then
            echo "apple-journal-cli@$VERSION is already on npm; nothing to publish."
            exit 0
          fi
          PACKAGE_EXISTS=$(lookup apple-journal-cli)
          if [ "$PACKAGE_EXISTS" = yes ]; then
            npm publish --provenance --access public
          elif [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "First publish of apple-journal-cli via NPM_TOKEN."
            npm publish --access public
          else
            echo "::warning::apple-journal-cli does not exist on npm yet and no NPM_TOKEN secret is set. Add a granular npm token as the NPM_TOKEN repo secret (or configure trusted publishing after a first publish) and re-run."
            exit 0
          fi
          npm view apple-journal-cli version
